<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vid Hood</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
background:#000;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
color:#fff;
}

.container{
width:100%;
max-width:420px;
position:relative;
padding:10px;
}

.ad-box{
width:100%;
margin:12px 0;
text-align:center;
}

/* VIDEO */
video{
width:100%;
border-radius:12px;
background:#000;
display:none;
}

/* PREVIEW IMAGE */
.preview-box{
position:absolute;
top:10px;
left:10px;
right:10px;
height:236px;
border-radius:12px;
overflow:hidden;
display:none;
z-index:15;
background:#000;
}

.preview-image{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

/* PLAY BUTTON */
.play-overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
background:rgba(0,0,0,0.35);
cursor:pointer;
}

.play-btn{
width:80px;
height:80px;
border-radius:50%;
background:rgba(255,255,255,0.2);
backdrop-filter:blur(4px);
display:flex;
justify-content:center;
align-items:center;
font-size:34px;
color:#fff;
border:2px solid rgba(255,255,255,0.5);
transition:0.3s;
}

.play-btn:hover{
transform:scale(1.08);
background:rgba(255,255,255,0.3);
}

.title{
font-size:16px;
margin:14px 0;
text-align:center;
}

.notice-link{
display:block;
margin-top:10px;
padding:14px;
font-size:20px;
font-weight:bold;
text-align:center;
color:#00ffcc;
border:2px solid #00ffcc;
border-radius:12px;
text-decoration:none;
transition:0.3s;
}

.notice-link:hover{
background:#00ffcc;
color:#000;
}

/* LOADING */
.loading-box{
position:absolute;
top:10px;
left:10px;
right:10px;
height:236px;
background:#000;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
border-radius:12px;
z-index:20;
}

.loading-text{
margin-bottom:12px;
font-size:14px;
}

.progress-bar{
width:70%;
height:6px;
background:#333;
border-radius:10px;
overflow:hidden;
}

.progress{
width:0%;
height:100%;
background:#00ffcc;
}

/* COUNTDOWN */
.countdown-box{
position:absolute;
top:10px;
left:10px;
right:10px;
height:236px;
display:none;
justify-content:center;
align-items:center;
background:rgba(0,0,0,0.5);
border-radius:12px;
z-index:30;
}

.countdown-text{
background:rgba(0,0,0,0.9);
padding:14px 18px;
border-radius:12px;
font-size:14px;
text-align:center;
position:relative;
}

.close-btn{
position:absolute;
top:6px;
right:10px;
cursor:pointer;
font-size:16px;
color:#fff;
}

</style>
</head>

<body>

<div class="container">

<!-- TOP ADS -->
<div class="ad-box">

<script>
atOptions = {
'key' : '353b956e6211d90a46527d74e98d287c',
'format' : 'iframe',
'height' : 50,
'width' : 320,
'params' : {}
};
</script>

<script src="https://www.highperformanceformat.com/353b956e6211d90a46527d74e98d287c/invoke.js"></script>

</div>

<!-- VIDEO -->
<video id="videoPlayer" controls playsinline>
<source id="videoSource" src="" type="video/mp4">
</video>

<!-- PREVIEW IMAGE -->
<div class="preview-box" id="previewBox">

<img 
src="https://www.shutterstock.com/shutterstock/videos/1105756875/thumb/6.jpg"
alt="Preview"
class="preview-image">

<!-- PLAY BUTTON -->
<div class="play-overlay" id="playOverlay">
<div class="play-btn">▶</div>
</div>

</div>

<!-- LOADING -->
<div class="loading-box" id="loadingBox">

<div class="loading-text" id="loadingText">
Loading video...
</div>

<div class="progress-bar">
<div class="progress" id="progressBar"></div>
</div>

</div>

<!-- BOTTOM ADS -->
<div class="ad-box">

<script>
atOptions = {
'key' : '353b956e6211d90a46527d74e98d287c',
'format' : 'iframe',
'height' : 50,
'width' : 320,
'params' : {}
};
</script>

<script src="https://www.highperformanceformat.com/353b956e6211d90a46527d74e98d287c/invoke.js"></script>

</div>

<!-- BACKUP LINK -->
<a href="#" target="_blank" class="notice-link" id="backupLink">
If the video fails to load, please visit our main website 🔥
</a>

<div class="title">
Watch till the end 😳🔥
</div>

<!-- COUNTDOWN -->
<div class="countdown-box" id="countdownBox">

<div class="countdown-text">

<span class="close-btn" onclick="closeAd()">✕</span>

<div id="countdownText">
Ad will open in 5 seconds...
</div>

</div>

</div>

</div>

<script>

// GET URL PARAMETER ?v=
const params = new URLSearchParams(window.location.search);
const videoId = params.get("v");

const video = document.getElementById("videoPlayer");
const source = document.getElementById("videoSource");
const backupLink = document.getElementById("backupLink");

if(videoId){

let finalLink = "https://cdn.videy.co/" + videoId + ".mp4";

source.src = finalLink;

video.load();

backupLink.href = finalLink;

}else{

document.querySelector(".title").innerText = "Video not found";

backupLink.href = "https://videy.co";

}

// FAKE LOADING
let progress = 0;

const progressBar = document.getElementById("progressBar");
const loadingText = document.getElementById("loadingText");

let loadingInterval = setInterval(() => {

progress += Math.random() * 15;

if(progress >= 100){

progress = 100;

clearInterval(loadingInterval);

// HIDE LOADING
document.getElementById("loadingBox").style.display = "none";

// SHOW PREVIEW IMAGE
document.getElementById("previewBox").style.display = "block";

}else if(progress > 60){

loadingText.innerText = "Preparing content...";

}

progressBar.style.width = progress + "%";

},300);


// PLAY VIDEO AFTER CLICKING PREVIEW
document.getElementById("playOverlay").addEventListener("click", () => {

document.getElementById("previewBox").style.display = "none";

video.style.display = "block";

video.play();

});




</script>
  
</body>
</html>
